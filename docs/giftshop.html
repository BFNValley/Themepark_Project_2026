<!DOCTYPE html>
<html>
<head>
  <title>Gift Shop (Employee)</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .back-btn {
      background-color: #7f8c8d;
      margin-bottom: 15px;
    }

    .back-btn:hover {
      background-color: #636e72;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .subtitle {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      color: #34495e;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button:hover {
      background-color: #1a252f;
    }

    hr {
      margin: 30px 0;
      border: none;
      border-top: 1px solid #eee;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #ecf0f1;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background-color: #c0392b;
    }

    .delete-btn:hover {
      background-color: #962d22;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- BACK BUTTON -->
  <button class="back-btn" onclick="goBack()">← Back</button>

  <h1>Gift Shop</h1>
  <p class="subtitle">Employee Inventory Management</p>

  <h2>Inventory Management</h2>

  <label>Product Name</label>
  <input id="newName" type="text">

  <label>Price ($)</label>
  <input id="newPrice" type="number" step="0.01">

  <label>Stock</label>
  <input id="newStock" type="number">

  <button onclick="addProduct()">Add Product</button>

  <hr>

  <h2>Current Inventory</h2>
  <ul id="inventoryList"></ul>

</div>

<script>

// BACK BUTTON
function goBack() {
  window.history.back();
}

let products = [];

// LOAD PRODUCTS
function loadProducts() {
  fetch('/products')
    .then(res => {
      if (!res.ok) throw new Error("Failed to load products");
      return res.json();
    })
    .then(data => {
      products = data;
      updateUI();
    })
    .catch(err => {
      console.error(err);
      alert("Could not load products.");
    });
}

// UPDATE UI
function updateUI() {
  const inventoryList = document.getElementById("inventoryList");
  inventoryList.innerHTML = "";

  products.forEach(product => {
    const li = document.createElement("li");

    const text = document.createElement("span");
    text.textContent = `${product.Name} | $${product.Price} | Stock: ${product.Stock}`;

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Remove";
    deleteBtn.className = "delete-btn";
    deleteBtn.onclick = () => removeProduct(product.ProductID);

    li.appendChild(text);
    li.appendChild(deleteBtn);

    inventoryList.appendChild(li);
  });
}

// ADD PRODUCT
function addProduct() {
  const name = document.getElementById("newName").value.trim();
  const price = parseFloat(document.getElementById("newPrice").value);
  const stock = parseInt(document.getElementById("newStock").value);

  if (!name || isNaN(price) || isNaN(stock)) {
    alert("Please fill all fields correctly.");
    return;
  }

  // "Trigger-like" validation
  if (stock < 0) {
    alert("Stock cannot be negative.");
    return;
  }

  fetch('/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ Name: name, Price: price, Stock: stock })
  })
  .then(res => {
    if (!res.ok) throw new Error("Failed to add product");

    document.getElementById("newName").value = "";
    document.getElementById("newPrice").value = "";
    document.getElementById("newStock").value = "";

    loadProducts();
  })
  .catch(err => {
    console.error(err);
    alert("Could not add product.");
  });
}

// REMOVE PRODUCT
function removeProduct(id) {
  fetch(`/products/${id}`, { method: 'DELETE' })
    .then(res => {
      if (!res.ok) throw new Error("Failed to delete");
      loadProducts();
    })
    .catch(err => {
      console.error(err);
      alert("Could not remove product.");
    });
}

// INITIAL LOAD
loadProducts();

</script>

</body>
</html>
